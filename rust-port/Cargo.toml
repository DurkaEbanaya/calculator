[package]
name = "mscalculator-rust"
version = "0.1.0"
edition = "2021"
authors = ["DurkaEbanaya"]
description = "Rust port of the Windows Calculator Standard mode, targeting macOS (x64/ARM) and Linux."
license = "MIT"
repository = "https://github.com/DurkaEbanaya/calculator"
rust-version = "1.76"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default", "x11", "wayland", "glow"] }
env_logger = "0.11"
log = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true

[[bin]]
name = "mscalculator-rust"
path = "src/main.rs"
